# ruff, mypy and the tests all passed with nothing outstanding on 2026-09-29.
# Nothing kept them there, so this does. 3.10 is the oldest Python the project
# claims to support and the one nobody develops on; 3.14 is the one they do.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # the annotate plugin turns a failing test into an annotation on the run
      # page, which anyone can read; the logs need a login
      - run: pip install -e ".[dev]" "pytest-github-actions-annotate-failures==0.4.2"
      # Each check runs even when one before it failed, so one run shows all
      # of what is wrong rather than the first thing.
      - name: ruff
        if: ${{ !cancelled() }}
        run: ruff check . --output-format github
      - name: mypy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mypy --no-pretty | tee mypy.txt || {
            sed -nE 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/p' mypy.txt
            exit 1
          }
      - name: tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
